title: 'Python Capstone: Sales Analytics Project'
description: 'Bring everything you have learned together in a real project: a complete analysis of two years of orders from an online store operating in 5 countries — data checks, delivery times, profit and correlation, comparisons by country, city and segment, product analysis, top customers, RFM segmentation and a final dashboard. Every graded exercise of Python4Business Day 9 is solved here step by step.'
