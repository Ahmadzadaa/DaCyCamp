title: 'Wrap-up: the dashboard and the report'
description: Bring the results together in one dashboard, recommendations for management and the final test.
steps:
  hesabat:
    title: Presenting the results
    content: |
      A manager won't read 15 tables. They need **4 charts + 5 sentences**.

      ## Dashboard: 2 × 2

      ```python
      fig, axes = plt.subplots(2, 2, figsize=(14, 9))
      fig.suptitle("DaCy Store — 2023–2024 sales analysis", fontsize=16)

      ayliq.plot(ax=axes[0, 0], title="Monthly sales")
      olke.plot(kind="bar", ax=axes[0, 1], title="Profit by country")
      kat.plot(kind="barh", ax=axes[1, 0], title="Category margin, %")
      seg.plot(kind="pie", ax=axes[1, 1], title="RFM segments", autopct="%1.0f%%")

      plt.tight_layout()
      plt.show()
      ```

      ## The monthly trend: resample

      ```python
      ayliq = df.set_index("OrderDate")["Sales"].resample("ME").sum()   # month end
      ```

      ## A report template (1 slide)

      1. **The key figure:** X AZN in sales and Y AZN in profit over 2 years (a margin of Z%).
      2. **Geography:** most of the profit comes from Turkey and Azerbaijan.
      3. **Products:** the sales leader ≠ the profit leader → review the discount policy.
      4. **Customers:** there are N customers in the "At risk" segment — run a win-back campaign.
      5. **Operations:** delivery takes about 4 days on average; the share of Same Day is small.

      > 💡 Each chart's title should be a **finding**, not a **question**: "55% of the profit comes from two countries" instead of "Profit by country". (This course's tests check fixed titles, but in a real report, write the finding.)
