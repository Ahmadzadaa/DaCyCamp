type: python
title: 'continue: lazım olmayanı burax'
xp: 30
estimated_minutes: 7
instructions: |
  Hər iki bənddə `continue` ilə istəmədiyin ədədləri burax və qalanlarını çap et. Şərti tərsinə düşün: «hansı ədədləri **buraxmalıyam**?»

  ```python
  for i in range(1, 11):
      if <buraxılacaq ədəd>:
          continue
      print(i)
  ```
tasks:
  - 'continue ilə 1-dən 10-a qədər olan ədədlərdən yalnız cüt ədədləri ekrana yazdır.'
  - 'continue ilə 1-dən 20-yə qədər olan ədədlərdən yalnız 5-ə bölünməyənləri ekrana yazdır.'
starter_code: |
  # 1. 1–10 arası cüt ədədlər (tək ədədləri continue ilə burax)


  # 2. 1–20 arası 5-ə bölünməyən ədədlər
solution: |
  # 1. 1–10 arası cüt ədədlər (tək ədədləri continue ilə burax)
  for i in range(1, 11):
      if i % 2 != 0:
          continue
      print(i)

  # 2. 1–20 arası 5-ə bölünməyən ədədlər
  for i in range(1, 21):
      if i % 5 == 0:
          continue
      print(i)
tests: |
  assert dacy.code.count("continue") >= 2, "Hər iki bənddə continue istifadə et"
  _nums = [int(_t) for _t in dacy.stdout.replace(",", " ").split() if _t.lstrip("-").isdigit()]
  _cut = [2, 4, 6, 8, 10]
  _bes_deyil = [_n for _n in range(1, 21) if _n % 5 != 0]
  assert _nums[:5] == _cut, f"Əvvəlcə 2, 4, 6, 8, 10 çap olunmalıdır, sənin çıxışın: {_nums[:5]}"
  assert _nums[5:] == _bes_deyil, f"Sonra 5-ə bölünməyənlər çap olunmalıdır: {_bes_deyil}"
hints:
  - 'Tək ədəd: i % 2 != 0 → continue.'
  - '5-ə bölünən: i % 5 == 0 → continue. Qalanları print(i).'
