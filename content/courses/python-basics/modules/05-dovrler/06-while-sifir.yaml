type: python
title: 'while: 0 daxil edilənə qədər oxu və topla'
xp: 40
estimated_minutes: 10
instructions: |
  İstifadəçidən ədədlər al və **0** daxil ediləndə dövrü dayandır. Eyni zamanda daxil edilən ədədlərin cəmini hesabla.

  Kodun yuxarısındakı hazır hissə `input()`-u əvəz edir: hər çağırışda `girisler` siyahısından növbəti dəyəri götürür (brauzerdə klaviatura girişi yoxdur). Sən adi Jupyter-dəki kimi yaz:

  ```python
  eded = int(input("Ədəd daxil edin: "))
  ```

  Bu girişlərlə cəm `8 + (-3) + 15 + 4 = 24` olmalıdır, 0-dan sonrakı `11` isə oxunmamalıdır.
tasks:
  - 'while dövrü ilə istifadəçidən ədədlər al, 0 daxil ediləndə dövrü dayandır.'
  - 'Daxil edilən ədədlərin cəmini hesabla (cem) və ekrana yazdır.'
starter_code: |
  # ── Brauzerdə klaviatura yoxdur: input() dəyərləri bu siyahıdan növbə ilə götürür ──
  girisler = ["8", "-3", "15", "4", "0", "11"]

  def input(sual=""):
