title: Data structures
description: Lists, tuples, dictionaries and sets — when to choose which, and their key methods.
steps:
  list-tuple:
    title: Lists and tuples
    content: |
      To store many values in one variable, we use **data structures**. Python has four main structures: `list`, `tuple`, `dict` and `set`. First, the first two.

      ## List — `[ ]`

      A list is an ordered, **mutable** (changeable) structure. It can hold data of any type and allows duplicates.

      - You can add, remove and change items.
      - The same value can appear several times.
      - Items are accessed by **index** — counting starts at **0**.

      ```python
      meyveler = ["alma", "armud", "heyva"]
      print(meyveler[0])     # alma — the first item
      print(meyveler[-1])    # heyva — the last item
      meyveler[1] = "nar"    # change the second item
      print(meyveler)        # ['alma', 'nar', 'heyva']
      ```

      ### Key methods

      | Method | What it does |
      | --- | --- |
      | `append(x)` | adds a new item to the end |
      | `remove(x)` | removes the given **value** (the first one found) |
      | `pop(i)` | removes and returns the item at the given **index**; `pop()` — the last one |
      | `len(list)` | the number of items |

      ```python
      my_list = [1, 2, 3, "apple"]
      my_list.append(4)          # [1, 2, 3, 'apple', 4]
      my_list.remove("apple")    # [1, 2, 3, 4]
      print(my_list)             # [1, 2, 3, 4]
      print(len(my_list))        # 4

      son = my_list.pop()        # 4 — the last item is removed and returned
      print(my_list)             # [1, 2, 3]
      ```

      > "The 3rd item" means the item at index **2**, because counting starts at 0: `[0] → 1st`, `[1] → 2nd`, `[2] → 3rd`.

      ## Tuple — `( )`

      A tuple is an ordered but **immutable** (unchangeable) structure. Once it's created, its items can't be changed — which makes it a safe choice for data that must not change (for example, coordinates, dates or fixed parameters).

      - Can't be changed.
      - Duplicates are allowed.
      - Accessed by index.

      ### Key methods

      | Method | What it does |
      | --- | --- |
      | `len(tuple)` | the number of items |
      | `count(x)` | how many times x appears |
      | `index(x)` | where x first appears (its index) |

      ```python
      my_tuple = (1, 2, 3, "banana")
      print(len(my_tuple))             # 4
      print(my_tuple.count(2))         # 1
      print(my_tuple.index("banana"))  # 3

      my_tuple[0] = 10   # TypeError — a tuple can't be changed
      ```
  dict-set:
    title: Dictionaries and sets
    content: |
      ## Dictionary — `{key: value}`

      A dictionary is made of **key–value** pairs. It works like a real dictionary: you look up a word (the key) and get its meaning (the value). Items are accessed not by index but by **key**.

      - Mutable: pairs can be added, removed and updated.
      - Keys must be **unique**.
      - Values can repeat.

      ### Key methods

      | Method | What it does |
      | --- | --- |
      | `d[key]` | the value of the key (`KeyError` if the key doesn't exist) |
      | `get(key)` | the value of the key (`None` if the key doesn't exist) |
      | `keys()` | all the keys |
      | `values()` | all the values |
      | `items()` | all the key–value pairs |
      | `update({...})` | adds new pairs or updates existing ones |

      ```python
      my_dict = {"name": "Riyad", "age": 25}
      print(my_dict["name"])         # Riyad
      print(my_dict.get("age"))      # 25

      my_dict["age"] = 26            # change the value of an existing key
      my_dict.update({"city": "Bakı"})
      print(my_dict)                 # {'name': 'Riyad', 'age': 26, 'city': 'Bakı'}

      print(my_dict.keys())          # dict_keys(['name', 'age', 'city'])
      ```

      ## Set — `{ }`

      A set contains only **unique** items. Duplicates are removed automatically, and the items have no order — so you can't access them by index. Sets are very useful for finding the unique values in a list.

      - Mutable: items can be added and removed.
      - Duplicate items aren't allowed.
      - Unordered, with no indexes.

      ### Key methods

      | Method | What it does |
      | --- | --- |
      | `add(x)` | adds an item |
      | `remove(x)` | removes an item |
      | `union(s)` | union — all the items in both sets |
      | `intersection(s)` | intersection — only the items that are in both |

      ```python
      my_set = {1, 2, 3, 4}
      my_set.add(5)        # {1, 2, 3, 4, 5}
      my_set.remove(2)     # {1, 3, 4, 5}

      another_set = {3, 4, 5, 6}
      print(my_set.union(another_set))          # {1, 3, 4, 5, 6}
      print(my_set.intersection(another_set))   # {3, 4, 5}

      seherler = ["Bakı", "Gəncə", "Bakı", "Şəki"]
      print(set(seherler))   # {'Bakı', 'Gəncə', 'Şəki'} — duplicates removed
      ```

      ## When to choose which?

      | Structure | Syntax | Ordered | Mutable | Duplicates | Used for |
      | --- | --- | --- | --- | --- | --- |
      | `list` | `[1, 2, 2]` | ✔ | ✔ | ✔ | general-purpose lists |
      | `tuple` | `(1, 2, 2)` | ✔ | ✘ | ✔ | data that must not change |
      | `dict` | `{"a": 1}` | by key | ✔ | keys ✘, values ✔ | lookups by key, records |
      | `set` | `{1, 2}` | ✘ | ✔ | ✘ | unique values, intersections |
  listler:
    title: 'Working with lists: append, remove, replace'
    instructions: |
      Lists are mutable: the methods change the list **itself**. For example, `my_list.append(6)` doesn't return a new list — it adds 6 to the end of `my_list`.

      Each item works with its own list, so a change in one item doesn't affect another.

      Reminder: counting starts at 0 — "the 3rd item" is the item at index 2.
    tasks:
      - Add the number 6 to the list my_list and print the result.
      - Remove the 3rd item from the list my_list2 and print the result.
      - Take the last value out of the list qarisiq (store it in the variable son) and replace the 3rd value with "cherry".
    hints:
      - my_list.append(6) — it changes the list itself, so there's no need to store the result in a variable.
      - 'Removing the 3rd item: my_list2.pop(2) (by index) or my_list2.remove(3) (by value).'
      - 'son = qarisiq.pop() removes and returns the last item. Then: qarisiq[2] = "cherry"'
    starter_code: |
      # 1. Add 6 to the end
      my_list = [1, 2, 3, 4, 5]

      print(my_list)

      # 2. Remove the 3rd item
      my_list2 = [1, 2, 3, 4, 5]

      print(my_list2)

      # 3. Take out the last value, replace the 3rd value with "cherry"
      qarisiq = [1, 2, 3, "apple", "pineapple", "pine"]
      son = ...

      print(son)
      print(qarisiq)
    solution: |
      # 1. Add 6 to the end
      my_list = [1, 2, 3, 4, 5]
      my_list.append(6)
      print(my_list)

      # 2. Remove the 3rd item
      my_list2 = [1, 2, 3, 4, 5]
      my_list2.pop(2)
      print(my_list2)

      # 3. Take out the last value, replace the 3rd value with "cherry"
      qarisiq = [1, 2, 3, "apple", "pineapple", "pine"]
      son = qarisiq.pop()
      qarisiq[2] = "cherry"
      print(son)
      print(qarisiq)
    tests: |
      assert my_list == [1, 2, 3, 4, 5, 6], f"my_list should be [1, 2, 3, 4, 5, 6], your result: {my_list!r}"
      assert ".append(" in dacy.code, "Item 1: use the append() method"
      assert my_list2 == [1, 2, 4, 5], f"my_list2 should be [1, 2, 4, 5], your result: {my_list2!r}"
      assert son == "pine", f'son should be "pine" (the last value of the list), your result: {son!r}'
      assert ".pop(" in dacy.code, "Item 3: take out the last value with pop()"
      assert qarisiq == [1, 2, "cherry", "apple", "pineapple"], f"qarisiq should be [1, 2, 'cherry', 'apple', 'pineapple'], your result: {qarisiq!r}"
      for _v in ("[1, 2, 3, 4, 5, 6]", "[1, 2, 4, 5]", "[1, 2, 'cherry', 'apple', 'pineapple']"):
          assert _v in dacy.lines, f"{_v} is not on the screen — print the list with print()"
  tuple-dict-set:
    title: Tuples, dictionaries and sets
    instructions: |
      Four short items — one operation for each structure.

      - In a tuple, `count()` gives the number of times an item appears.
      - In a dictionary, a value is accessed by its **key**: `my_dict["key"]`. Changing a key's value uses the same syntax: `my_dict["key"] = new_value`.
      - An item is added to a set with `add()`.

      The dictionaries use Azerbaijani keys: `"ad"` (name), `"yaş"` (age) and `"peşə"` (profession). Keep them exactly as written.
    tasks:
      - Find how many times the item 20 appears in my_tuple (say).
      - Find the value of the "yaş" (age) key in my_dict (yas) and print it.
      - Add the number 5 to my_set and print the result.
      - In my_dict2, change the value of the "yaş" key to 22.
    hints:
      - say = my_tuple.count(20)
      - yas = my_dict["yaş"] or my_dict.get("yaş")
      - my_set.add(5); my_dict2["yaş"] = 22
    starter_code: |
      # 1. Tuple: how many times does 20 appear?
      my_tuple = (10, 20, 30, 40)
      say = ...
      print(say)

      # 2. Dictionary: the value of the "yaş" (age) key
      my_dict = {"ad": "Əli", "yaş": 30, "peşə": "Mühəndis"}
      yas = ...
      print(yas)

      # 3. Set: add 5
      my_set = {1, 2, 3, 4}

      print(my_set)

      # 4. Dictionary: set the "yaş" value to 22
      my_dict2 = {"ad": "Riyad", "yaş": 30, "peşə": "Mühəndis"}

      print(my_dict2)
    solution: |
      # 1. Tuple: how many times does 20 appear?
      my_tuple = (10, 20, 30, 40)
      say = my_tuple.count(20)
      print(say)

      # 2. Dictionary: the value of the "yaş" (age) key
      my_dict = {"ad": "Əli", "yaş": 30, "peşə": "Mühəndis"}
      yas = my_dict["yaş"]
      print(yas)

      # 3. Set: add 5
      my_set = {1, 2, 3, 4}
      my_set.add(5)
      print(my_set)

      # 4. Dictionary: set the "yaş" value to 22
      my_dict2 = {"ad": "Riyad", "yaş": 30, "peşə": "Mühəndis"}
      my_dict2["yaş"] = 22
      print(my_dict2)
    tests: |
      assert say == 1, f"say should be 1, your result: {say!r}"
      assert ".count(" in dacy.code, "Item 1: use the count() method"
      assert yas == 30, f"yas should be 30, your result: {yas!r}"
      assert my_dict == {"ad": "Əli", "yaş": 30, "peşə": "Mühəndis"}, "Don't change my_dict — just read the value"
      assert "30" in dacy.lines, "30 is not on the screen — print yas with print()"
      assert my_set == {1, 2, 3, 4, 5}, f"my_set should be {{1, 2, 3, 4, 5}}, your result: {my_set!r}"
      assert ".add(" in dacy.code, "Item 3: use the add() method"
      assert "{1, 2, 3, 4, 5}" in dacy.lines, "{1, 2, 3, 4, 5} is not on the screen — print my_set with print()"
      assert my_dict2 == {"ad": "Riyad", "yaş": 22, "peşə": "Mühəndis"}, f"In my_dict2, only \"yaş\" should change to 22, your result: {my_dict2!r}"
  strukturlar-testi:
    title: 'Quiz: Data structures'
    questions:
      - text: Which structure can't be changed after it's created?
        options:
          - list
          - set
          - tuple
          - dict
      - text: In which structure are duplicate items removed automatically?
        options:
          - the values of a dict
          - tuple
          - set
          - list
      - text: If `meyveler = ["alma", "armud", "heyva"]`, what is `meyveler[1]`?
        options:
          - '"alma"'
          - IndexError
          - '"armud"'
          - '"heyva"'
        explanation: Indexes start at 0, so [1] is the second item.
      - text: What is the difference between `pop()` and `remove()`?
        options:
          - pop() only works with tuples
          - pop() removes by index (by default, the last item) and returns the item; remove() removes by value
          - There's no difference
          - remove() removes by index, pop() by value
      - text: 'If `d = {"ad": "Riyad"}`, what does `d.get("yaş")` return?'
        options:
          - None
          - A KeyError
          - '0'
          - An empty string
        explanation: get() returns None if the key doesn't exist. `d["yaş"]`, on the other hand, would raise a KeyError.
      - text: What is the result of `{1, 2, 3}.intersection({2, 3, 4})`?
        options:
          - '{2, 3}'
          - '{1, 2, 3, 4}'
          - '{1, 4}'
          - set()
        explanation: The intersection — the items that are in both sets.
      - text: What is the result of `(1, 2, 2, 3).count(2)`?
        options:
          - '1'
          - '3'
          - '0'
          - '2'
      - text: Which structure is best for storing information about a customer (name, age, city) and accessing it by name?
        options:
          - tuple
          - list
          - dict
          - set
        explanation: 'A dictionary lets you access values by key: `musteri["ad"]`, `musteri["yaş"]`.'
