title: What is Data Analytics?
description: 'A no-code, plain-language introduction to data analytics: how to ask questions of data, find answers and make decisions. The 4 types of analytics, the 6 steps of the analysis process, SMART questions and KPIs, data types, data cleaning, basic statistics, correlation and A/B testing, choosing the right chart, dashboards and storytelling with data. Practice based on real-world scenarios after every lesson.'
