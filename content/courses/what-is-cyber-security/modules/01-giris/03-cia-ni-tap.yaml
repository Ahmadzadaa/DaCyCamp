type: quiz
title: 'Məşq: CIA-nı tap'
xp: 20
estimated_minutes: 4
pass_score: 100
questions:
- text: NarPay-də baş vermiş insidentlər. Hər biri CIA triadasının hansı prinsipini **ən çox** pozur?
  type: classify
  buckets:
  - name: Məxfilik
    items:
    - Müştərilərin kart məlumatları internetə sızdı
    - İşçi icazəsi olmadan həmkarının maaş məlumatlarına baxdı
  - name: Bütövlük
    items:
    - Hücumçu köçürmənin məbləğini 100 ₼-dan 10 000 ₼-a dəyişdi
    - Virus mühasibat cədvəlindəki rəqəmləri korladı
  - name: Əlçatanlıq
    items:
    - DDoS hücumu səbəbindən NarPay tətbiqi 3 saat açılmadı
    - Server otağında yanğın sistemləri dayandırdı
    - Ransomware faylları şifrələdi və heç kim onları aça bilmir
  explanation: Sızma və icazəsiz baxış — məxfilik; datanın dəyişdirilməsi və korlanması — bütövlük; sistemin
    və ya datanın istifadə oluna bilməməsi — əlçatanlıq.
- text: Hansı tədbir əsasən **bütövlüyü** (integrity) qoruyur?
  options:
  - Serverin ehtiyat nüsxəsini başqa şəhərdə saxlamaq
  - Faylın heş dəyərini yoxlamaq ki, dəyişdirilmədiyinə əmin olaq
  - Ofis girişinə mühafizəçi qoymaq
  - Sayta DDoS müdafiəsi qoşmaq
  correct:
  - 2
  explanation: 'Heş dəyəri faylın «barmaq izi»dir: bir simvol dəyişsə, heş tamamilə dəyişir. Ehtiyat nüsxə
    və DDoS müdafiəsi əlçatanlığı qoruyur.'
